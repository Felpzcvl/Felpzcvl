<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Fellipe Cavalcanti — Desenvolvedor de Software em formação">
  <defs>
    <radialGradient id="glowA" cx="82%" cy="0%" r="70%">
      <stop offset="0" stop-color="#2f81f7" stop-opacity=".22"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0%" cy="100%" r="60%">
      <stop offset="0" stop-color="#8957e5" stop-opacity=".12"/>
      <stop offset="1" stop-color="#8957e5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" x2="1">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79c0ff"/>
      <stop offset="1" stop-color="#388bfd"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#0d419d"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#163d7a"/>
      <stop offset="1" stop-color="#0a2552"/>
    </linearGradient>
    <linearGradient id="topP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d2a8ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="leftP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8957e5"/>
      <stop offset="1" stop-color="#553098"/>
    </linearGradient>
    <linearGradient id="rightP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f2475"/>
      <stop offset="1" stop-color="#271650"/>
    </linearGradient>
    <radialGradient id="shadow">
      <stop offset="0" stop-color="#2f81f7" stop-opacity=".35"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>
    <!-- cubo isométrico: aresta 36 -->
    <g id="cube">
      <path d="M0 0 31.2 18 0 36 -31.2 18Z" fill="url(#top)"/>
      <path d="M-31.2 18 0 36 0 72 -31.2 54Z" fill="url(#left)"/>
      <path d="M0 36 31.2 18 31.2 54 0 72Z" fill="url(#right)"/>
      <path d="M-31.2 18 0 36 31.2 18M0 36V72" fill="none" stroke="#c9e2ff" stroke-opacity=".35" stroke-width=".8"/>
    </g>
    <g id="cubeP">
      <path d="M0 0 31.2 18 0 36 -31.2 18Z" fill="url(#topP)"/>
      <path d="M-31.2 18 0 36 0 72 -31.2 54Z" fill="url(#leftP)"/>
      <path d="M0 36 31.2 18 31.2 54 0 72Z" fill="url(#rightP)"/>
      <path d="M-31.2 18 0 36 31.2 18M0 36V72" fill="none" stroke="#efe2ff" stroke-opacity=".4" stroke-width=".8"/>
    </g>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#f0f6fc" fill-opacity=".06"/>
    </pattern>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'Cascadia Code', 'SF Mono', Consolas, 'Liberation Mono', monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="16" fill="#0b0f14"/>
  <rect width="1200" height="320" rx="16" fill="url(#dots)"/>
  <rect width="1200" height="320" rx="16" fill="url(#glowA)"/>
  <rect width="1200" height="320" rx="16" fill="url(#glowB)"/>
  <rect x=".5" y=".5" width="1199" height="319" rx="15.5" fill="none" stroke="#f0f6fc" stroke-opacity=".08"/>

  <!-- identidade -->
  <text x="72" y="92" class="mono" font-size="15" fill="#7d8590" letter-spacing="1">~/felpzcvl</text>
  <text x="70" y="158" class="sans" font-size="60" font-weight="600" fill="#f0f6fc" letter-spacing="-1.5">Fellipe Cavalcanti</text>
  <rect x="72" y="182" width="260" height="2" fill="url(#rule)"/>
  <text x="72" y="220" class="sans" font-size="21" fill="#adbac7">Desenvolvedor de Software em formação</text>
  <text x="72" y="252" class="mono" font-size="15" fill="#7d8590">Java · JavaScript · Docker · GitHub Actions — Brasília, DF</text>

  <!-- cubos 3D (containers) -->
  <g transform="translate(694 0)">
    <ellipse cx="0" cy="252" rx="78" ry="14" fill="url(#shadow)">
      <animate attributeName="rx" values="78;70;78" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
      <use href="#cube" x="0" y="96"/>
      <use href="#cubeP" x="0" y="60"/>
      <use href="#cube" x="-31.2" y="114"/>
      <use href="#cube" x="31.2" y="114"/>
    </g>
    <g opacity=".55">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 6;0 0" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
      <path d="M54 46l10.4 6-10.4 6-10.4-6Z M43.6 52v12l10.4 6 10.4-6V52M54 58v12" fill="none" stroke="#79c0ff" stroke-width="1.1" stroke-linejoin="round"/>
    </g>
    <g opacity=".45">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
      <path d="M-58 64l7 4-7 4-7-4Z M-65 68v8l7 4 7-4v-8M-58 72v8" fill="none" stroke="#d2a8ff" stroke-width="1" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- terminal -->
  <g transform="translate(790 82)">
    <rect width="338" height="156" rx="12" fill="#0d1117" fill-opacity=".85" stroke="#f0f6fc" stroke-opacity=".1"/>
    <circle cx="20" cy="20" r="5" fill="#f0f6fc" fill-opacity=".15"/>
    <circle cx="38" cy="20" r="5" fill="#f0f6fc" fill-opacity=".15"/>
    <circle cx="56" cy="20" r="5" fill="#f0f6fc" fill-opacity=".15"/>
    <g class="mono" font-size="14">
      <text x="20" y="62"><tspan fill="#2f81f7">$</tspan><tspan fill="#e6edf3"> whoami</tspan></text>
      <text x="20" y="84" fill="#adbac7">estudante de ADS · Projeção</text>
      <text x="20" y="114"><tspan fill="#2f81f7">$</tspan><tspan fill="#e6edf3"> status</tspan></text>
      <text x="20" y="136"><tspan fill="#3fb950">●</tspan><tspan fill="#adbac7"> aberto a estágio</tspan></text>
    </g>
    <rect class="cursor" x="180" y="124" width="8" height="16" fill="#2f81f7"/>
  </g>
</svg>
