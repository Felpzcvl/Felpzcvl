<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Fellipe Cavalcanti — Desenvolvedor de Software em formação">
  <defs>
    <radialGradient id="glowA" cx="82%" cy="0%" r="70%">
      <stop offset="0" stop-color="#2f81f7" stop-opacity=".22"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0%" cy="100%" r="60%">
      <stop offset="0" stop-color="#8957e5" stop-opacity=".12"/>
      <stop offset="1" stop-color="#8957e5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" x2="1">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#f0f6fc" fill-opacity=".06"/>
    </pattern>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'Cascadia Code', 'SF Mono', Consolas, 'Liberation Mono', monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="16" fill="#0b0f14"/>
  <rect width="1200" height="320" rx="16" fill="url(#dots)"/>
  <rect width="1200" height="320" rx="16" fill="url(#glowA)"/>
  <rect width="1200" height="320" rx="16" fill="url(#glowB)"/>
  <rect x=".5" y=".5" width="1199" height="319" rx="15.5" fill="none" stroke="#f0f6fc" stroke-opacity=".08"/>

  <!-- identidade -->
  <text x="72" y="92" class="mono" font-size="15" fill="#7d8590" letter-spacing="1">~/felpzcvl</text>
  <text x="70" y="158" class="sans" font-size="60" font-weight="600" fill="#f0f6fc" letter-spacing="-1.5">Fellipe Cavalcanti</text>
  <rect x="72" y="182" width="260" height="2" fill="url(#rule)"/>
  <text x="72" y="220" class="sans" font-size="21" fill="#adbac7">Desenvolvedor de Software em formação</text>
  <text x="72" y="252" class="mono" font-size="15" fill="#7d8590">Java · JavaScript · Docker · GitHub Actions — Brasília, DF</text>

  <!-- terminal -->
  <g transform="translate(790 82)">
    <rect width="338" height="156" rx="12" fill="#0d1117" fill-opacity=".85" stroke="#f0f6fc" stroke-opacity=".1"/>
    <circle cx="20" cy="20" r="5" fill="#f0f6fc" fill-opacity=".15"/>
    <circle cx="38" cy="20" r="5" fill="#f0f6fc" fill-opacity=".15"/>
    <circle cx="56" cy="20" r="5" fill="#f0f6fc" fill-opacity=".15"/>
    <g class="mono" font-size="14">
      <text x="20" y="62"><tspan fill="#2f81f7">$</tspan><tspan fill="#e6edf3"> whoami</tspan></text>
      <text x="20" y="84" fill="#adbac7">estudante de ADS · Projeção</text>
      <text x="20" y="114"><tspan fill="#2f81f7">$</tspan><tspan fill="#e6edf3"> status</tspan></text>
      <text x="20" y="136"><tspan fill="#3fb950">●</tspan><tspan fill="#adbac7"> aberto a estágio</tspan></text>
    </g>
    <rect class="cursor" x="180" y="124" width="8" height="16" fill="#2f81f7"/>
  </g>
</svg>
